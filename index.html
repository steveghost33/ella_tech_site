         need noindex (Legal, TermsOfUse, ResearchForm) render their own via
         Helmet — adding a default here would leave two conflicting
         meta[name=robots] tags on those pages since Helmet only adds tags,
         it doesn't remove this static one. -->

    <!-- Static fallback meta for non-JS crawlers. On React 19, Helmet's
         title/meta/link tags are hoisted into <head> as NEW elements rather
         than replacing these — they don't get removed automatically. The
         data-rh-static marker lets main.jsx strip these before the app
         mounts, so the client only ever has one of each tag. The prerender
         step replaces these outright per route, so this fallback only
         matters for dev mode or an unprerendered route. -->
